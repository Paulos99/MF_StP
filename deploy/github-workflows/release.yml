name: Выпуск (по метке vX.Y.Z)

# Срабатывает, когда владелец ставит метку выпуска, например v1.0.0.
# Повторно проверяет расчёт, собирает статику (путь файлов относительный — работает по любому адресу,
# в том числе https://stp-multiframe.ru/calc/) и прикладывает к выпуску на GitHub архив calc-<метка>.zip
# и файл контрольной суммы. Команда, размещающая сайт, берёт этот архив (deploy/install-release.sh) и код не правит.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Метка должна лежать на ветке main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Метка ${GITHUB_REF_NAME} не входит в ветку main. Выпуск отменён." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка раскладки панелей
        run: npm test

      - name: Сборка
        run: npm run build:esbuild

      - name: Проверка сборки
        run: |
          test -f dist/index.html
          grep -q 'src="./assets/app.js"' dist/index.html
          # Сборка не должна подгружать скрипты с чужих серверов (import("https://…"))
          ! grep -rqE 'import\(["'"'"'`]https?://' dist

      - name: Архив выпуска
        run: |
          echo "${GITHUB_REF_NAME}" > dist/version.txt
          cd dist
          zip -qr "../calc-${GITHUB_REF_NAME}.zip" .
          cd ..
          sha256sum "calc-${GITHUB_REF_NAME}.zip" > "calc-${GITHUB_REF_NAME}.zip.sha256"
          cat "calc-${GITHUB_REF_NAME}.zip.sha256"

      - name: Публикация выпуска на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "calc-${GITHUB_REF_NAME}.zip" \
            "calc-${GITHUB_REF_NAME}.zip.sha256" \
            --title "Калькулятор ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
