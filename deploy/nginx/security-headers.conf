# Заголовки безопасности для калькулятора. Подключаются командой `include` внутри каждого блока location
# (nginx не наследует add_header во вложенный location, если там задан свой add_header).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Политика в режиме наблюдения (Report-Only): ничего не блокирует, нарушения видны в консоли браузера.
# Проверена на сборке выпуска (расчёт, схема, PDF): нарушений нет.
# Шрифт Manrope входит в сборку (assets/fonts/), внешние шрифтовые серверы не нужны.
# 'unsafe-inline' в script-src нужен из-за встроенных обработчиков onerror в index.html (убрать — правка кода, выпуск владельца).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
