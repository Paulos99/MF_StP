# Калькулятор MultiFRAME на https://stp-multiframe.ru/calc/
#
# Вставьте содержимое в блок server { ... } сайта stp-multiframe.ru (который уже слушает 443 с сертификатом).
# Пути поправьте под свой сервер. Предполагается:
#   /var/www/stp-multiframe.ru/calc  — ссылка на текущий выпуск (её переключает deploy/install-release.sh)
#   /etc/nginx/snippets/calc-security-headers.conf — копия файла deploy/nginx/security-headers.conf
#
# Калькулятор — статика с относительными путями (./assets/...): работает по любому адресу, но адрес должен
# заканчиваться на «/», поэтому /calc перенаправляется на /calc/. Серверного «запасного» index.html не нужно:
# это одна страница, внутренних адресов у неё нет.

location = /calc { return 301 /calc/; }

# Страницы и служебные файлы: браузер каждый раз сверяет версию (быстрый ответ 304, если не менялось).
location /calc/ {
    root /var/www/stp-multiframe.ru;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    include snippets/calc-security-headers.conf;
}

# Скрипты и стили лежат в assets/ под постоянными именами (без хеша) — поэтому только проверка версии, не долгий кэш.
location /calc/assets/ {
    root /var/www/stp-multiframe.ru;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    include snippets/calc-security-headers.conf;
}

# Картинки интерфейса: сутки.
location ~ ^/calc/[^/]+\.(png|jpg|svg)$ {
    root /var/www/stp-multiframe.ru;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    include snippets/calc-security-headers.conf;
}

location = /calc/version.txt {
    root /var/www/stp-multiframe.ru;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include snippets/calc-security-headers.conf;
}
