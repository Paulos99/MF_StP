name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка раскладки панелей
        run: npm test

      - name: Сборка
        run: npm run build:esbuild

      - name: Проверка сборки
        run: |
          test -f dist/index.html
          grep -q 'src="./assets/app.js"' dist/index.html
          ! grep -rqE 'import\(["'"'"'`]https?://' dist

      - name: Архив для проверки
        uses: actions/upload-artifact@v4
        with:
          name: calc-dist
          path: dist
          retention-days: 14
